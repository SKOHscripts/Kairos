# Pipeline GitLab de Kairos : pendant de .github/workflows/ci.yml et
# .github/workflows/release.yml pour un hébergement sur un GitLab (instance
# d'entreprise, dépôt privé). Voir docs/spec/mises-a-jour.md.
#
# - Tests à chaque push, merge request et tag.
# - Sur un tag vX.Y.Z : exécutable Linux, APK Android, exécutable Windows (si un
#   runner Windows est disponible, voir build-windows), puis release GitLab avec
#   les fichiers et leur SHA256SUMS (registre de paquets génériques du projet).
# - Un pipeline lancé à la main (Build > Pipelines > Run pipeline) construit
#   tout sans rien publier : utile pour valider le packaging.
#
# Les exécutables et l'APK construits ici embarquent ce projet GitLab comme
# source de leurs mises à jour (packaging/write_build_info.py) : la mise à jour
# intégrée suit ainsi le dépôt qui les a construits, sans réglage (sauf le jeton
# de lecture d'un dépôt privé, à saisir dans Réglages > Mises à jour).
#
# Variables CI/CD à définir (Settings > CI/CD > Variables, masquées et
# protégées) pour signer l'APK, comme les secrets GitHub du même nom :
# KAIROS_KEYSTORE_BASE64, KAIROS_KEYSTORE_PASSWORD, KAIROS_KEY_ALIAS,
# KAIROS_KEY_PASSWORD. Et KAIROS_WINDOWS_RUNNER=true si un runner Windows est
# enregistré avec le tag « windows ».

stages: [test, build, release]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: pip
  paths: [.cache/pip]

.release-or-manual:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "web"

.build-info:
  # Version (tag, ou 0.0.0-dev hors tag) et source des mises à jour (ce projet).
  script:
    - >
      python packaging/write_build_info.py
      --version "${CI_COMMIT_TAG:-0.0.0-dev}"
      --server-url "$CI_SERVER_URL"
      --project "$CI_PROJECT_PATH"

test:
  stage: test
  image: python:3.11-bookworm
  script:
    - pip install -e ".[dev]"
    - pytest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build-linux:
  stage: build
  # Image Debian complète (pas « slim ») : binutils pour PyInstaller et
  # tkinter pour sa fenêtre de démarrage.
  image: python:3.11-bookworm
  extends: .release-or-manual
  script:
    - pip install -e ".[dev]" pyinstaller pyinstaller-hooks-contrib
    - !reference [.build-info, script]
    - pyinstaller packaging/kairos.spec --distpath dist --noconfirm
    - python packaging/smoke_test.py dist/kairos
    - mkdir -p out && cp dist/kairos out/kairos-linux-x86_64
  artifacts:
    paths: [out/]
    expire_in: 1 week

# PyInstaller ne fait pas de cross-compile : l'exécutable Windows exige un
# runner Windows (shell PowerShell, Python 3.11 dans le PATH), que les runners
# partagés d'une instance d'entreprise n'offrent pas toujours. Sans lui
# (KAIROS_WINDOWS_RUNNER absent), la release sort sans exécutable Windows, et
# la mise à jour intégrée d'un poste Windows le signale au lieu d'installer.
build-windows:
  stage: build
  tags: [windows]
  rules:
    - if: $KAIROS_WINDOWS_RUNNER != "true"
      when: never
    - !reference [.release-or-manual, rules]
  script:
    - python -m pip install -e ".[dev]" pyinstaller pyinstaller-hooks-contrib
    - $version = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "0.0.0-dev" }
    - python packaging/write_build_info.py --version $version --server-url $env:CI_SERVER_URL --project $env:CI_PROJECT_PATH
    - pyinstaller packaging/kairos.spec --distpath dist --noconfirm
    - python packaging/smoke_test.py dist/kairos.exe
    - New-Item -ItemType Directory -Force -Path out | Out-Null
    - Copy-Item dist/kairos.exe out/kairos-windows-x86_64.exe
  artifacts:
    paths: [out/]
    expire_in: 1 week

build-android:
  stage: build
  # Python 3.13 : la version embarquée par Chaquopy (son pip de build cherche
  # python3.13). JDK 17 et SDK Android installés ici, mis en cache.
  image: python:3.13-bookworm
  extends: .release-or-manual
  variables:
    ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
    ANDROID_CMDLINE_TOOLS_URL: "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
  cache:
    key: android
    paths: [.android-sdk, .gradle-home]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openjdk-17-jdk-headless unzip > /dev/null
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -sSLo /tmp/cmdline-tools.zip "$ANDROID_CMDLINE_TOOLS_URL"
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    # `|| true` : `yes` finit tué par SIGPIPE, ce que `pipefail` (shell des
    # runners) prendrait pour un échec.
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
  script:
    - !reference [.build-info, script]
    # Même règle que sur GitHub : une release taguée DOIT être signée (sinon
    # l'APK ne s'installerait pas par-dessus la version précédente).
    - |
      if [ -n "$KAIROS_KEYSTORE_BASE64" ]; then
        echo "$KAIROS_KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/kairos-release.keystore"
        export KAIROS_KEYSTORE_FILE="$CI_PROJECT_DIR/kairos-release.keystore"
      elif [ -n "$CI_COMMIT_TAG" ]; then
        echo "Variable KAIROS_KEYSTORE_BASE64 absente : APK de release impossible à signer." >&2
        exit 1
      else
        echo "Variables de signature absentes : APK de validation NON signé."
      fi
    - export KAIROS_VERSION="${CI_COMMIT_TAG:-0.0.0-dev}"
    - (cd android && ./gradlew --no-daemon assembleRelease)
    - mkdir -p out && cp android/app/build/outputs/apk/release/app-release*.apk out/kairos-android-arm64.apk
  artifacts:
    paths: [out/]
    expire_in: 1 week

release:
  stage: release
  image: python:3.11-slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
    - build-linux
    - build-android
    - job: build-windows
      optional: true
  cache: []
  script:
    - python packaging/publish_gitlab_release.py out/
