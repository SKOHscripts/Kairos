# Contrôles rapides de Kairos (docs/spec/distribution.md § CI) : quelques secondes chacun, sans construire l'application,
# sur chaque PR et chaque push sur main, sans filtre de chemins (rien ne leur échappe). Deux jobs parallèles :
# - metadata : fiches, page et README (docs/spec/publication.md § Vérification continue), menu du site, tests des scripts
#   de kmp/tools/ ;
# - version : la version que main doit porter et quand publier (docs/spec/distribution.md § Version attendue).
name: Kairos checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 kmp/tools/validate_fastlane.py
      - run: python3 kmp/tools/validate_badges.py
      - run: python3 kmp/tools/validate_og.py
      # Menu du site (docs/spec/publication.md § Menu du site).
      - run: python3 kmp/tools/validate_menu.py
      # Identité de l'app figée (docs/spec/distribution.md § Identité de l'app).
      - run: python3 kmp/tools/validate_identity.py
      # Scripts de kmp/tools/ (nettoyage des artefacts, carte du code, version attendue…).
      - run: python3 -m unittest discover -s kmp/tools -p 'test_*.py'

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Les tags (dernière finale) et l'historique depuis elle.
          fetch-depth: 0
      - run: python3 kmp/tools/next_version.py --check
