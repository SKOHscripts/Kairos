# Pose le tag d'une version de Kairos depuis l'onglet Actions (docs/spec/distribution.md § Cycle des versions).
#
# Actions → « Kairos tag » → « Run workflow » sur main, en recopiant la version de kmp/gradle.properties : le workflow
# vérifie tout ce qu'un tag tapé à la main pouvait rater, pose le tag sur le dernier commit de main, puis lance la
# release. Il exige la section de la version dans CHANGELOG.md (PR de release fusionnée, docs/spec/distribution.md
# § Release Please) et passe ensuite cette PR de « autorelease: pending » à « autorelease: tagged ». Un tag poussé avec le jeton du workflow (GITHUB_TOKEN) ne déclenche pas les autres workflows : la release est
# donc lancée explicitement (workflow_dispatch sur la référence du tag, qu'elle traite comme un tag poussé). Après une
# finale, ouvre la PR qui passe main à la mineure suivante (docs/spec/distribution.md § Version attendue).
name: Kairos tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, recopiée de kmp/gradle.properties (ex. 4.1.0-beta.1 ou 4.1.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: kairos-tag
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier la version
        id: check
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=$(sed -n 's/^kairos.versionName=//p' kmp/gradle.properties)
          code=$(sed -n 's/^kairos.versionCode=//p' kmp/gradle.properties)
          wanted="${VERSION#v}"
          if [ "$wanted" != "$name" ]; then
            echo "::error::Version demandée $wanted, mais kmp/gradle.properties dit $name : recopie la version de main."
            exit 1
          fi
          # Le cycle (mineures au fil de l'eau, betas facultatives) : X.Y.Z, ou X.Y.0-beta.N avec N de 1 à 98 (99 marque une finale ; plus d'alpha).
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$name" =~ ^[0-9]+\.[0-9]+\.0-beta\.([1-9]|[1-8][0-9]|9[0-8])$ ]]; then
            echo "::error::$name n'est pas une version du cycle (X.Y.Z ou X.Y.0-beta.N, N de 1 à 98)."
            exit 1
          fi
          # La formule du versionCode (AppVersion) : AppVersionTest la vérifie aussi, mais un tag ne doit pas partir avant.
          python3 - "$name" "$code" <<'PY'
          import re, sys
          name, code = sys.argv[1], int(sys.argv[2])
          major, minor, patch, stage, n = re.match(r"(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta)\.(\d+))?$", name).groups()
          # À partir de la 4.2.0, une seule app pour la beta et la stable (docs/spec/distribution.md § Versionnage).
          if int(major) * 100 + int(minor) >= 402:
              expected = int(major) * 1000000 + int(minor) * 10000 + int(patch) * 100 + (int(n) if stage else 99)
          else:
              expected = int(major) * 10000 + int(minor) * 100 + int(patch)
              if stage:
                  expected += (-500 if stage == "beta" else -1000) + int(n)
          if expected != code:
              sys.exit(f"::error::kairos.versionCode={code}, attendu {expected} pour {name}")
          PY
          if git rev-parse -q --verify "refs/tags/v$name" >/dev/null; then
            echo "::error::Le tag v$name existe déjà : passe main à la version suivante (kmp/tools/set_version.py)."
            exit 1
          fi
          # Une version finale part avec sa note de version dans les six langues des fiches.
          if [[ "$name" != *-* ]]; then
            for locale in en-US fr-FR de-DE es-ES it-IT ru-RU; do
              note="fastlane/metadata/android/$locale/changelogs/$code.txt"
              if [ ! -s "$note" ]; then
                echo "::error::$note manque : une version finale a sa note dans les six langues."
                exit 1
              fi
            done
          fi
          # Le journal (docs/spec/distribution.md § Release Please) : la PR de release de cette version est fusionnée.
          if ! grep -Eq "^##+ \[${name//./\\.}\]" CHANGELOG.md 2>/dev/null; then
            echo "::error::CHANGELOG.md n'a pas la section $name : fusionne la PR de release « chore(release): Kairos $name », puis relance."
            exit 1
          fi
          # La CI de main ne doit pas être rouge sur ce commit (absente : la release refait tous les tests).
          sha=$(git rev-parse HEAD)
          state=$(gh run list --workflow kmp.yml --commit "$sha" --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"' || true)
          case "$state" in
            ""|"completed success") ;;
            "completed "*) echo "::error::La CI (kmp.yml) a échoué sur $sha : $state."; exit 1 ;;
            *) echo "::error::La CI (kmp.yml) tourne encore sur $sha ($state) : relance quand elle est verte."; exit 1 ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Fériés recalculés à chaque version (docs/spec/jours-feries.md § Recalcul à chaque version) : la table versionnée est
      # comparée à la dernière python-holidays ; périmée, le workflow ouvre la PR qui la met à jour et refuse le tag, à relancer
      # une fois la PR fusionnée (la table reste dans le dépôt : un build depuis le tag la retrouve telle quelle).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fériés à jour
        env:
          NAME: ${{ steps.check.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade holidays
          if python kmp/tools/make_holidays.py --check; then exit 0; fi
          python kmp/tools/make_holidays.py
          source=$(python -c "import holidays; print(holidays.__version__)")
          branch="holidays/$NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(holidays): refresh public holidays from python-holidays $source"
          # Branche du robot, recréée à chaque essai : la PR suit le dernier calcul.
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(holidays): refresh public holidays for $NAME" \
            --body "The public holiday table changed with python-holidays $source (docs/spec/jours-feries.md). Merge this PR, then run « Kairos tag » again for $NAME." \
            || echo "PR déjà ouverte pour $branch."
          # Une PR ouverte avec le jeton du workflow ne déclenche aucun workflow : on lance ses contrôles.
          for workflow in kmp.yml metadata.yml; do gh workflow run "$workflow" --ref "$branch"; done
          echo "Fériés périmés : PR \`$branch\` ouverte. Fusionne-la, puis relance « Kairos tag »." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Table des fériés périmée (python-holidays $source) : fusionne la PR $branch, puis relance « Kairos tag »."
          exit 1
      - name: Poser le tag et lancer la release
        env:
          NAME: ${{ steps.check.outputs.name }}
          SHA: ${{ steps.check.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NAME" "$SHA" -m "Kairos $NAME"
          git push origin "v$NAME"
          gh workflow run kmp-release.yml --ref "v$NAME"
          # La PR de release fusionnée passe à « tagged » : Release Please, qui ne crée pas la release (skip-github-release),
          # refuserait sinon d'ouvrir la suivante (docs/spec/distribution.md § Release Please).
          gh label create "autorelease: tagged" --color EDEDED --force >/dev/null
          for pr in $(gh pr list --state merged --label "autorelease: pending" --json number --jq '.[].number'); do
            gh pr edit "$pr" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          done
          {
            echo "### Kairos $NAME"
            echo "Tag \`v$NAME\` posé sur \`$SHA\`, release lancée (onglet Actions, « Kairos release »)."
            if [[ "$NAME" == *-* ]]; then echo "Préversion : ni F-Droid, ni AUR, ni vérification des mises à jour des versions stables."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Après une finale, main passe à la mineure suivante par une PR (docs/spec/distribution.md § Version attendue). Le
      # tag est déjà posé : un échec ici (réglage « Allow GitHub Actions to create and approve pull requests » absent,
      # branche existante) ne doit pas faire échouer le lancement, le résumé donne alors la commande.
      - name: Proposer la version suivante
        if: ${{ !contains(steps.check.outputs.name, '-') }}
        continue-on-error: true
        env:
          NAME: ${{ steps.check.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          next=$(python3 -c "import sys; x, y, _ = map(int, sys.argv[1].split('.')); print(f'{x}.{y + 1}.0')" "$NAME")
          branch="version/$next"
          echo "La suite : \`python3 kmp/tools/set_version.py $next\` (ou \`$next-beta.1\` pour un chantier risqué)." >> "$GITHUB_STEP_SUMMARY"
          git switch -c "$branch"
          python3 kmp/tools/set_version.py "$next"
          git commit -am "chore(version): set $next"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(version): set $next" --body "Kairos $NAME is tagged: main moves to the next minor, $next (docs/spec/distribution.md § Cycle des versions). For risky work, change it to \`$next-beta.1\` before merging (\`python3 kmp/tools/set_version.py $next-beta.1\`)."
          # Une PR ouverte avec le jeton du workflow ne déclenche aucun workflow : on lance ses contrôles.
          for workflow in kmp.yml metadata.yml fdroid-check.yml; do gh workflow run "$workflow" --ref "$branch"; done
          echo "PR ouverte : \`$branch\` → main ($next)." >> "$GITHUB_STEP_SUMMARY"
      - name: Après une beta
        if: ${{ contains(steps.check.outputs.name, '-') }}
        env:
          NAME: ${{ steps.check.outputs.name }}
        run: |
          n=${NAME##*.}
          echo "La suite : \`python3 kmp/tools/set_version.py ${NAME%.*}.$((n + 1))\` pour une autre beta, ou \`python3 kmp/tools/set_version.py ${NAME%%-*}\` pour la finale." >> "$GITHUB_STEP_SUMMARY"
