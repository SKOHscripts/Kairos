# Release de Kairos (docs/spec/distribution.md § Release) : sur tag vX.Y.Z ou vX.Y.0-beta.N (posé par « Kairos tag »,
# kmp-tag.yml, ou à la main),
# APK signé, installeurs et images portables des trois OS de bureau, version
# web, SHA256SUMS, release GitHub (préversion si le tag a un suffixe), paquet AUR
# kairos-bin pour une version stable.
name: Kairos 3 release

on:
  push:
    # Toute version à partir de la 3 (les v2.* sont ceux de l'ancienne version) : une 5.0.0 n'aura rien à changer ici.
    tags: ["v[3-9].*", "v[1-9][0-9].*"]
  # Lancement manuel : sur main, une construction de validation ; sur la référence d'un tag (ce que fait kmp-tag.yml),
  # une vraie release (`github.ref_type == 'tag'`).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      # Le tag doit être la version déclarée dans kmp/gradle.properties (source
      # unique) ; le versionCode, lui, est vérifié par AppVersionTest.
      - id: v
        run: |
          name=$(sed -n 's/^kairos.versionName=//p' kmp/gradle.properties)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [[ "$name" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$name" ]; then
            echo "::error::Le tag ${{ github.ref_name }} ne correspond pas à kairos.versionName=$name (kmp/gradle.properties)."
            exit 1
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Plateforme Android 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Tests
        run: ./gradlew --no-daemon :core:jvmTest :data:jvmTest :ui:jvmTest :desktopApp:jvmTest
      # Toujours le même keystore (mêmes secrets) : chaque version s'installe par-dessus
      # la précédente. Un tag DOIT être signé ; un lancement manuel sans secrets
      # produit un APK non signé de validation.
      - name: Keystore de signature
        id: keystore
        env:
          KAIROS_KEYSTORE_BASE64: ${{ secrets.KAIROS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KAIROS_KEYSTORE_BASE64" ]; then
            echo "$KAIROS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kairos-release.keystore"
            echo "file=$RUNNER_TEMP/kairos-release.keystore" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "::error::Secret KAIROS_KEYSTORE_BASE64 absent : une release taguée doit être signée."
            exit 1
          else
            echo "::warning::Secrets de signature absents : APK de validation NON signé."
          fi
      - name: APK
        env:
          KAIROS_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          KAIROS_KEYSTORE_PASSWORD: ${{ secrets.KAIROS_KEYSTORE_PASSWORD }}
          KAIROS_KEY_ALIAS: ${{ secrets.KAIROS_KEY_ALIAS }}
          KAIROS_KEY_PASSWORD: ${{ secrets.KAIROS_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :androidApp:assembleRelease
          mkdir -p "$RUNNER_TEMP/out"
          cp androidApp/build/outputs/apk/release/androidApp-release*.apk "$RUNNER_TEMP/out/Kairos-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: kairos3-android
          path: ${{ runner.temp }}/out/*
          retention-days: 3

  web:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version web
        run: |
          ./gradlew --no-daemon :webApp:wasmJsBrowserDistribution
          mkdir -p "$RUNNER_TEMP/out"
          (cd webApp/build/dist/wasmJs/productionExecutable && zip -qr "$RUNNER_TEMP/out/Kairos-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: kairos3-web
          path: ${{ runner.temp }}/out/*
          retention-days: 3

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            id: linux-x64
          - os: windows-latest
            id: windows-x64
          - os: macos-latest
            id: macos-arm64
          - os: macos-15-intel
            id: macos-x64
    runs-on: ${{ matrix.os }}
    # Signature Windows (docs/spec/distribution.md § Signature Windows, issue #117) : l'action SignPath lit l'artefact
    # non signé par l'API des Actions.
    permissions:
      actions: read
      contents: read
    env:
      # Vrai seulement quand le propriétaire a configuré SignPath ; sinon (forks, contributeurs) l'installeur reste
      # non signé, comme avant.
      SIGNPATH_READY: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    defaults:
      run:
        shell: bash
        working-directory: kmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: fakeroot (paquet .deb)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fakeroot > /dev/null
      - name: Installeur et image portable
        run: ./gradlew --no-daemon :desktopApp:packageDistributionForCurrentOS :desktopApp:createDistributable

      # Auto-test : l'image empaquetée démarre et rend l'interface (docs/spec/distribution.md § Auto-test).
      - name: Auto-test (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          app=desktopApp/build/compose/binaries/main/app
          if [ "$RUNNER_OS" = "macOS" ]; then
            bundle=$(ls -d "$app"/*.app | head -1); name=$(basename "$bundle" .app)
            exe="$bundle/Contents/MacOS/$name"
          else
            dir=$(ls -d "$app"/*/ | head -1); name=$(basename "$dir"); exe="$dir/bin/$name"
          fi
          KAIROS_DATA_DIR="$RUNNER_TEMP/kairos-data" "$exe" --self-test="$RUNNER_TEMP/screens"
      - name: Auto-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Get-ChildItem desktopApp/build/compose/binaries/main/app -Directory | Select-Object -First 1
          $exe = Join-Path $dir.FullName ($dir.Name + ".exe")
          $env:KAIROS_DATA_DIR = Join-Path $env:RUNNER_TEMP "kairos-data"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test=$env:RUNNER_TEMP\screens" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Auto-test en échec ($($p.ExitCode))"; exit 1 }

      - name: Nommer les fichiers
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          bin=desktopApp/build/compose/binaries/main
          id=${{ matrix.id }}
          # Marqueur des seules archives portables, après les installeurs : la copie
          # portable propose alors son raccourci (docs/spec/raccourci-portable.md).
          image=$(ls -d "$bin"/app/*/ | head -1)
          case "$RUNNER_OS" in
            Linux)
              cp "$bin"/deb/*.deb "$out/Kairos-$id.deb"
              touch "${image}lib/app/kairos-portable"
              (cd "$bin/app" && tar czf "$out/Kairos-$id-portable.tar.gz" *) ;;
            Windows)
              cp "$bin"/msi/*.msi "$out/Kairos-$id.msi"
              touch "${image}app/kairos-portable"
              (cd "$bin/app" && 7z a -tzip -bso0 "$(cygpath -w "$out")\\Kairos-$id-portable.zip" *) ;;
            macOS)
              cp "$bin"/dmg/*.dmg "$out/Kairos-$id.dmg"
              (cd "$bin/app" && ditto -c -k --keepParent *.app "$out/Kairos-$id-portable.zip") ;;
          esac
          ls -la "$out"

      # Signature Authenticode de l'installeur et du zip portable par SignPath Foundation (docs/spec/distribution.md
      # § Signature Windows, issue #117) : sur un tag seulement (chaque demande attend l'approbation manuelle d'un
      # approbateur), et seulement si SignPath est configuré. La configuration d'artefact du projet SignPath est
      # `.signpath/artifact-configuration.xml`. Les fichiers signés remplacent les non signés dans `out`, donc dans la
      # release et `SHA256SUMS`. L'artefact non signé ne commence pas par `kairos3-` : la release ne le reprend pas.
      - name: Fichiers à signer (Windows)
        id: unsigned
        if: runner.os == 'Windows' && github.ref_type == 'tag' && env.SIGNPATH_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/out/Kairos-${{ matrix.id }}.msi
            ${{ runner.temp }}/out/Kairos-${{ matrix.id }}-portable.zip
          if-no-files-found: error
          retention-days: 3
      - name: Signature (SignPath Foundation)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Kairos' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # L'approbation est manuelle : une heure pour la donner.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/out
      - name: Vérifier les signatures (Windows)
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "out"
          $portable = Join-Path $env:RUNNER_TEMP "portable"
          Expand-Archive -Path (Join-Path $out "Kairos-${{ matrix.id }}-portable.zip") -DestinationPath $portable
          $files = @(Get-Item (Join-Path $out "Kairos-${{ matrix.id }}.msi")) + @(Get-ChildItem $portable -Recurse -Filter "Kairos*.exe")
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Output "$($f.Name) : $($s.Status) ($($s.SignerCertificate.Subject))"
            if ($s.Status -ne "Valid") { Write-Error "Signature invalide : $($f.Name)"; exit 1 }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: kairos3-${{ matrix.id }}
          path: ${{ runner.temp }}/out/*
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.id }}
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 3

  release:
    needs: [version, android, web, desktop]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kairos3-*
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: artifacts
        run: sha256sum Kairos-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Kairos ${{ needs.version.outputs.name }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/Kairos-*
            artifacts/SHA256SUMS

  # Paquet AUR kairos-bin (docs/spec/distribution.md § Paquet Arch Linux) : construit, installé et lancé dans un
  # conteneur Arch à partir du .deb publié, puis poussé sur l'AUR sur un tag stable si le secret existe. Lancement
  # manuel : construit et testé seulement.
  aur:
    needs: [version, desktop, release]
    if: >-
      always() && needs.version.outputs.prerelease == 'false' && needs.desktop.result == 'success'
      && (needs.release.result == 'success' || github.ref_type != 'tag')
    runs-on: ubuntu-latest
    env:
      AUR_READY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kairos3-linux-x64
          path: artifacts
      - name: Construire et tester (conteneur Arch)
        run: |
          docker run --rm -v "$PWD:/w" -w /w archlinux:base-devel \
            bash packaging/aur/build.sh "${{ needs.version.outputs.name }}" artifacts/Kairos-linux-x64.deb aur-out
      - uses: actions/upload-artifact@v4
        with:
          name: aur-kairos-bin
          path: aur-out/
          # Pour une poussée à la main sur l'AUR quand le secret manque (distribution.md § Paquet Arch Linux).
          retention-days: 7
          include-hidden-files: true
      - name: Publier sur l'AUR
        if: github.ref_type == 'tag' && env.AUR_READY == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: bash packaging/aur/publish.sh aur-out

  # Une release lancée par « Kairos tag » (kmp-tag.yml) l'est avec le jeton du workflow : la fin de cette release ne
  # déclenche pas de façon sûre les workflows qui la suivent (workflow_run). On les lance donc ici : la page de
  # téléchargement, et, pour une version finale, la comparaison F-Droid à l'APK publié.
  follow-up:
    needs: [version, release]
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Page de téléchargement
        run: gh workflow run pages.yml --ref main
      - name: Comparaison F-Droid (version finale)
        if: needs.version.outputs.prerelease == 'false'
        run: gh workflow run fdroid-check.yml --ref "${{ github.ref_name }}" -f after_release=true
