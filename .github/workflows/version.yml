# Version que main doit porter (docs/spec/distribution.md § Version attendue) : d'après ce qui est fusionné depuis la
# dernière finale (cartes du catalogue, format du fichier), échoue si la version déclarée est trop basse et dit quand
# publier. Sans filtre de chemins : tout changement compte. Quelques secondes, sans construire l'application.
name: Kairos version

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Les tags (dernière finale) et l'historique depuis elle.
          fetch-depth: 0
      - run: python3 kmp/tools/next_version.py --check
