# GitHub Pages de Kairos (docs/spec/publication.md § Page de téléchargement).
#
# - /          : page de téléchargement, versionnée dans site/ (FR, et en/ es/ de/ ru/ it/) ;
# - /preview/  : version web construite depuis main (préversion, change à chaque push) ;
# - /app/      : version web de la dernière release stable v3 ou plus récente (Kairos-web.zip
#                de la release), absente tant qu'aucune version finale n'est publiée.
#
# Les liens de téléchargement visent une release nommée par son tag, jamais
# releases/latest : une release est toujours désignée par son tag. Seuls les tags
# v3 et au-delà comptent (les v2.* sont ceux de l'ancienne version) : le filtre
# « v3. » seul laissait la page sur la 3.14.0 après la sortie de la 4.0.0.
#
# Prérequis, une fois : Settings → Pages → Source : « GitHub Actions ».
name: Pages

on:
  push:
    branches: [main]
    # La page ne dépend que de la version web, du site et des captures : ni Android, ni bureau, ni scripts.
    paths: ["kmp/**", "!kmp/androidApp/**", "!kmp/desktopApp/**", "!kmp/tools/**", "site/**", "fastlane/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  # La release créée par kmp-release.yml (jeton GITHUB_TOKEN) ne déclenche pas
  # l'événement `release` ci-dessus : on suit la fin de ce workflow.
  workflow_run:
    workflows: ["Kairos 3 release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version web (préversion, main)
        working-directory: kmp
        run: ./gradlew --no-daemon :webApp:wasmJsBrowserDistribution
      - name: Assembler le site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/site"
          cp -r site "$out"
          mkdir -p "$out/preview" "$out/fonts" "$out/screens/fr" "$out/screens/en"
          cp -r kmp/webApp/build/dist/wasmJs/productionExecutable/. "$out/preview/"
          # Roboto servie par la page elle-même (jamais de police distante).
          cp kmp/ui/src/commonMain/composeResources/font/*.ttf "$out/fonts/"
          # Captures : celles des magasins (fastlane), une seule source.
          cp fastlane/metadata/android/fr-FR/images/phoneScreenshots/*.png "$out/screens/fr/"
          cp fastlane/metadata/android/en-US/images/phoneScreenshots/*.png "$out/screens/en/"

          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName,isPrerelease)
          current='select(.tagName | test("^v([3-9]|[1-9][0-9]+)\\."))'
          stable=$(jq -r "[.[] | $current | select(.isPrerelease | not) | .tagName][0] // empty" <<<"$releases")
          pre=$(jq -r "[.[] | $current | .tagName][0] // empty" <<<"$releases")
          base="https://github.com/$GITHUB_REPOSITORY/releases"
          preview="" web="preview/"
          if [ -n "$stable" ]; then
            dl="$base/download/$stable"
            if gh release download "$stable" --repo "$GITHUB_REPOSITORY" --pattern Kairos-web.zip --dir "$RUNNER_TEMP"; then
              mkdir -p "$out/app" && unzip -q "$RUNNER_TEMP/Kairos-web.zip" -d "$out/app"
              web="app/"
            fi
          elif [ -n "$pre" ]; then
            dl="$base/download/$pre"
            preview=${pre#v}
          else
            dl="$base"
          fi
          echo "Téléchargements : $dl ; web : $web"
          # Substitution sans interprétation des caractères spéciaux (& / \) du remplacement. Une page par langue
          # (docs/spec/i18n.md) : le français à la racine, les autres dans leur dossier ; les captures sont celles de en-US.
          DL="$dl" WEB="$web" PREVIEW="$preview" python3 - "$out" <<'PY'
          import os, sys
          notices = {
              "FR": "<strong>Préversion {v}.</strong> Aucune version stable n’est encore publiée : les liens ci-dessous mènent à la dernière préversion. Sur Android, elle s’installe à côté de la version stable, sous le nom « Kairos Preview ».",
              "EN": "<strong>Preview {v}.</strong> No stable release is published yet: the links below lead to the latest preview. On Android it installs next to the stable version, as “Kairos Preview”.",
              "ES": "<strong>Versión preliminar {v}.</strong> Todavía no hay ninguna versión estable publicada: los enlaces de abajo llevan a la última versión preliminar. En Android se instala junto a la versión estable, con el nombre «Kairos Preview».",
              "DE": "<strong>Vorabversion {v}.</strong> Es ist noch keine stabile Version veröffentlicht: Die Links unten führen zur neuesten Vorabversion. Unter Android wird sie neben der stabilen Version installiert, unter dem Namen „Kairos Preview“.",
              "RU": "<strong>Предварительная версия {v}.</strong> Стабильная версия еще не опубликована: ссылки ниже ведут на последнюю предварительную версию. На Android она устанавливается рядом со стабильной версией под названием «Kairos Preview».",
              "IT": "<strong>Anteprima {v}.</strong> Non è ancora stata pubblicata alcuna versione stabile: i link qui sotto portano all’ultima anteprima. Su Android si installa accanto alla versione stabile, con il nome «Kairos Preview».",
          }
          pages = {"FR": "index.html", "EN": "en/index.html", "ES": "es/index.html", "DE": "de/index.html", "RU": "ru/index.html", "IT": "it/index.html"}
          v = os.environ["PREVIEW"]
          for code, name in pages.items():
              subs = {"@@DL@@": os.environ["DL"], "@@WEB@@": os.environ["WEB"],
                      f"@@NOTICE_{code}@@": f'<p class="notice">{notices[code].format(v=v)}</p>' if v else ""}
              path = os.path.join(sys.argv[1], name)
              text = open(path, encoding="utf-8").read()
              for key, value in subs.items():
                  text = text.replace(key, value)
              assert "@@" not in text, f"marqueur non remplacé dans {path}"
              open(path, "w", encoding="utf-8").write(text)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
