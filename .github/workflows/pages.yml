# GitHub Pages de Kairos (docs/spec/publication.md § Page de téléchargement).
#
# - /          : page de téléchargement, versionnée dans site/ (FR, et en/ pour l'anglais) ;
# - /preview/  : version web construite depuis main (préversion, change à chaque push) ;
# - /app/      : version web de la dernière release stable v3 (Kairos-web.zip de la
#                release), absente tant qu'aucune 3.x finale n'est publiée.
#
# Les liens de téléchargement visent une release v3 nommée par son tag, jamais
# releases/latest : « latest » désigne la dernière release stable du dépôt, qui
# reste une 2.x tant que la 3.0.0 n'est pas sortie (autres noms de fichiers).
#
# Prérequis, une fois : Settings → Pages → Source : « GitHub Actions ».
name: Pages

on:
  push:
    branches: [main]
    paths: ["kmp/**", "site/**", "fastlane/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  # La release créée par kmp-release.yml (jeton GITHUB_TOKEN) ne déclenche pas
  # l'événement `release` ci-dessus : on suit la fin de ce workflow.
  workflow_run:
    workflows: ["Kairos 3 release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version web (préversion, main)
        working-directory: kmp
        run: ./gradlew --no-daemon :webApp:wasmJsBrowserDistribution
      - name: Assembler le site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/site"
          cp -r site "$out"
          mkdir -p "$out/preview" "$out/fonts" "$out/screens/fr" "$out/screens/en"
          cp -r kmp/webApp/build/dist/wasmJs/productionExecutable/. "$out/preview/"
          # Roboto servie par la page elle-même (jamais de police distante).
          cp kmp/ui/src/commonMain/composeResources/font/*.ttf "$out/fonts/"
          # Captures : celles des magasins (fastlane), une seule source.
          cp fastlane/metadata/android/fr-FR/images/phoneScreenshots/*.png "$out/screens/fr/"
          cp fastlane/metadata/android/en-US/images/phoneScreenshots/*.png "$out/screens/en/"

          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName,isPrerelease)
          stable=$(jq -r '[.[] | select(.tagName | startswith("v3.")) | select(.isPrerelease | not) | .tagName][0] // empty' <<<"$releases")
          pre=$(jq -r '[.[] | select(.tagName | startswith("v3.")) | .tagName][0] // empty' <<<"$releases")
          base="https://github.com/$GITHUB_REPOSITORY/releases"
          notice_fr="" notice_en="" web="preview/"
          if [ -n "$stable" ]; then
            dl="$base/download/$stable"
            if gh release download "$stable" --repo "$GITHUB_REPOSITORY" --pattern Kairos-web.zip --dir "$RUNNER_TEMP"; then
              mkdir -p "$out/app" && unzip -q "$RUNNER_TEMP/Kairos-web.zip" -d "$out/app"
              web="app/"
            fi
          elif [ -n "$pre" ]; then
            dl="$base/download/$pre"
            v=${pre#v}
            notice_fr="<p class=\"notice\"><strong>Préversion $v.</strong> Kairos 3 n’est pas encore sorti : les liens ci-dessous mènent à sa dernière préversion. Sur Android, elle s’installe à côté de Kairos 2, sous le nom « Kairos Preview ».</p>"
            notice_en="<p class=\"notice\"><strong>Preview $v.</strong> Kairos 3 is not out yet: the links below lead to its latest preview. On Android it installs next to Kairos 2, as “Kairos Preview”.</p>"
          else
            dl="$base"
          fi
          echo "Téléchargements : $dl ; web : $web"
          # Substitution sans interprétation des caractères spéciaux (& / \) du remplacement.
          DL="$dl" WEB="$web" NFR="$notice_fr" NEN="$notice_en" python3 - "$out/index.html" "$out/en/index.html" <<'PY'
          import os, sys
          subs = {"@@DL@@": os.environ["DL"], "@@WEB@@": os.environ["WEB"],
                  "@@NOTICE_FR@@": os.environ["NFR"], "@@NOTICE_EN@@": os.environ["NEN"]}
          for path in sys.argv[1:]:
              text = open(path, encoding="utf-8").read()
              for key, value in subs.items():
                  text = text.replace(key, value)
              assert "@@" not in text, f"marqueur non remplacé dans {path}"
              open(path, "w", encoding="utf-8").write(text)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
