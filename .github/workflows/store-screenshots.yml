# Captures des fiches de magasin (docs/spec/publication.md § Captures) : rend les captures des six langues avec
# `--store-screenshots` et les dépose comme artefact, pour les relire puis les commiter. Rien n'est écrit dans le dépôt.
# Lancé à la main, ou sur une PR qui change le générateur ou ce workflow.
name: Store screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kmp/desktopApp/src/jvmMain/kotlin/com/skohscripts/kairos/desktop/StoreScreenshots.kt"
      - "kmp/desktopApp/src/jvmMain/kotlin/com/skohscripts/kairos/desktop/StoreTeam.kt"
      - ".github/workflows/store-screenshots.yml"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Captures des magasins
        run: ./gradlew --no-daemon :desktopApp:run --args="--store-screenshots=$GITHUB_WORKSPACE/fastlane/metadata/android"

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: fastlane/metadata/android/*/images/phoneScreenshots/*.png
          retention-days: 7
