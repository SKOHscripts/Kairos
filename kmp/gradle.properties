# Version de Kairos : SOURCE UNIQUE pour Android, bureau et web
# (docs/spec-v3/distribution.md § Versionnage). F-Droid la lit ici
# (UpdateCheckData de fdroid/com.skohscripts.kairos.yml) ; la CI de release
# vérifie qu'elle correspond au tag et que le code suit la formule :
#   X.Y.Z           -> X*10000 + Y*100 + Z
#   X.Y.Z-alpha.N   -> (X*10000 + Y*100 + Z) - 1000 + N
#   X.Y.Z-beta.N    -> (X*10000 + Y*100 + Z) - 500 + N
kairos.versionName=3.0.0-alpha.1
kairos.versionCode=29001

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
