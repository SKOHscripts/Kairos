# Version de Kairos : SOURCE UNIQUE pour Android, bureau et web
# (docs/spec/distribution.md § Versionnage). F-Droid la lit ici
# (UpdateCheckData de fdroid/com.skohscripts.kairos.yml) ; la CI de release
# vérifie qu'elle correspond au tag et que le code suit la formule :
#   X*1000000 + Y*10000 + Z*100 + s (s = numéro de beta, 99 pour une finale)
kairos.versionName=4.6.0-beta.1
kairos.versionCode=4060001

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
