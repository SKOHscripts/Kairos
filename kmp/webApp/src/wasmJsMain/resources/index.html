<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kairos</title>
  <meta name="description" content="Kairos : le bon moment pour chaque tâche. Version web, sans installation.">
  <meta name="theme-color" content="#FAF8FF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    html, body { height: 100%; margin: 0; background: #FAF8FF; color: #1A1B21; }
    body { font: 14px/20px system-ui, sans-serif; overflow: hidden; }
    /* Relais de la page de démarrage (docs/spec/demarrage.md) : le cadran vide exactement centré, à la
       taille du cadran de StartupSplash (184,32 px = dp dans Compose web), le texte dessous. */
    #kairos-loading { position: fixed; inset: 0; }
    #kairos-loading svg { position: absolute; left: 50%; top: 50%; width: 184.32px; height: 184.32px;
      transform: translate(-50%, -50%); }
    #kairos-loading p { position: absolute; left: 16px; right: 16px; top: calc(50% + 92.16px + 32px);
      max-width: 420px; margin: 0 auto; color: #44464F; text-align: center; }
    /* Système en sombre (docs/spec/apparence.md § Thème sombre) : surface et textes de KairosDarkColors. */
    @media (prefers-color-scheme: dark) {
      html, body { background: #121318; color: #E2E2E9; }
      #kairos-loading p { color: #C5C6D0; }
    }
  </style>
</head>
<body>
  <!-- Visible pendant le chargement du module Wasm, et comme message si le
       navigateur ne peut pas le charger (WasmGC absent : Edge / Chrome avant 119). -->
  <div id="kairos-loading">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18.5" fill="#FFEEDC" stroke="#FFCC85" stroke-width="1.6"/>
      <circle cx="20" cy="20" r="2.6" fill="#2B251C"/>
    </svg>
    <p id="kairos-loading-text">Chargement de Kairos…</p>
  </div>
  <script>
    // Kotlin/Wasm exige WasmGC : sans lui, on le dit plutôt que de laisser un écran figé.
    (function () {
      var gc = false;
      try {
        gc = WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
      } catch (e) { gc = false; }
      if (!gc) {
        document.getElementById("kairos-loading-text").textContent =
          "Ce navigateur est trop ancien pour Kairos : utilise une version récente d'Edge, de Chrome ou de Firefox. " +
          "This browser is too old for Kairos: use a recent Edge, Chrome or Firefox.";
      }
    })();
  </script>
  <script src="kairos-web.js"></script>
  <script src="kairos.js"></script>
</body>
</html>
